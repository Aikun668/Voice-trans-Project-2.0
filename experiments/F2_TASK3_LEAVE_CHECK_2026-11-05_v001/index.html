<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>任务三 · 离开我的依赖</title><style>
:root{font-family:system-ui,'Microsoft Yahei',sans-serif;color:#182335;background:#f4f7fb}body{max-width:850px;margin:0 auto;padding:26px 16px 90px;line-height:1.6}h1{font-size:1.65rem;margin:.2em 0}h2{font-size:1.1rem;margin:0 0 8px}.intro,.card{background:#fff;border:1px solid #d9e3ef;border-radius:14px;padding:18px;margin:14px 0}.intro{background:#eef6ff}.tip{color:#53677c;font-size:.94rem}button{font:inherit;cursor:pointer;border:1px solid #a8bcd2;border-radius:9px;background:#fff;padding:8px 14px;margin:4px 6px 4px 0}button.play{background:#e9f3ff;color:#164e87;border-color:#b2cee9}button.primary{background:#175caa;border-color:#175caa;color:white;font-weight:bold}.choices{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.choices label{border:1px solid #d9e3ef;border-radius:8px;padding:6px 10px;cursor:pointer}.choices label:has(input:checked){background:#dceeff;border-color:#397bc5}textarea{width:100%;box-sizing:border-box;padding:10px;font:inherit;border:1px solid #b8c6d7;border-radius:8px}#status{position:sticky;bottom:8px;background:#17283e;color:white;padding:10px 14px;border-radius:9px}#result{height:130px}a{color:#175caa}
</style></head><body><h1>任务三：再核对两处</h1><div class="intro"><b>只听《离开我的依赖》的两处。</b><p>先听短片段，必要时再听前后句。拿不准就选“拿不准”；做完生成答案发我。</p></div>
<div class="card"><h2>1. 你的“边”</h2><p>短片段是否完整唱出“边”，没有明显切掉或多出别的字？</p><button class="play" data-clip="self_bian">▶ 听短片段</button><button class="play" data-clip="self_context">▶ 听前后句</button><div class="choices"><label><input type="radio" name="self" value="完整">完整</label><label><input type="radio" name="self" value="有切掉或多出">有切掉或多出</label><label><input type="radio" name="self" value="拿不准">拿不准</label></div></div>
<div class="card"><h2>2. 原唱“诺是”</h2><p>短片段是否完整唱出“诺是”，没有明显切掉或多出别的字？</p><button class="play" data-clip="ref_nuoshi">▶ 听短片段</button><button class="play" data-clip="ref_context">▶ 听前后句</button><div class="choices"><label><input type="radio" name="ref" value="完整">完整</label><label><input type="radio" name="ref" value="有切掉或多出">有切掉或多出</label><label><input type="radio" name="ref" value="拿不准">拿不准</label></div></div>
<div class="card"><h2>完成后</h2><textarea id="note" rows="2" placeholder="补充（可留空）"></textarea><p><button id="make" class="primary">生成答案并复制</button><button id="download">下载答案</button></p><p id="message" class="tip"></p><textarea id="result" readonly aria-label="生成的答案"></textarea></div><div id="status">未播放</div>
<script>
const clips=[{"id": "self_bian", "label": "本人“边”候选", "source": "test_dataset/my_singing/rerecord_2026-11-04_f2/wav/离开我的依赖01-轻度跑调.wav", "start": 7.52, "end": 8.32, "sha256": "3861f9938869f26af95c846bf995bd77fad4c4f7a3188a0534224f4fae10e09d"}, {"id": "self_context", "label": "本人前后句", "source": "test_dataset/my_singing/rerecord_2026-11-04_f2/wav/离开我的依赖01-轻度跑调.wav", "start": 6.96, "end": 8.7, "sha256": "3861f9938869f26af95c846bf995bd77fad4c4f7a3188a0534224f4fae10e09d"}, {"id": "ref_nuoshi", "label": "原唱“诺是”候选", "source": "test_dataset/my_singing/rerecord_2026-11-04_f2/ref_vocals/离开我的依赖_王艳薇_vocals.wav", "start": 78.66, "end": 79.3, "sha256": "b866b5f275b9c91d012a088be5102e6afcd77e0f44c8a2f59eff8d349655406e"}, {"id": "ref_context", "label": "原唱前后句", "source": "test_dataset/my_singing/rerecord_2026-11-04_f2/ref_vocals/离开我的依赖_王艳薇_vocals.wav", "start": 77.6, "end": 80.5, "sha256": "b866b5f275b9c91d012a088be5102e6afcd77e0f44c8a2f59eff8d349655406e"}];const lookup=Object.fromEntries(clips.map(x=>[x.id,x]));const audio=new Audio();let current=0,stop=null,raf=0;const status=document.querySelector('#status');
audio.volume=.6;
function tick(){if(stop!==null&&!audio.paused){if(audio.currentTime>=stop){audio.pause();stop=null;status.textContent='已播放完';return;}raf=requestAnimationFrame(tick)}}
document.querySelectorAll('[data-clip]').forEach(b=>b.addEventListener('click',()=>{const c=lookup[b.dataset.clip];const ticket=++current;cancelAnimationFrame(raf);stop=null;audio.pause();audio.src='../../'+c.source;audio.load();status.textContent='准备播放：'+c.label;audio.onloadedmetadata=()=>{if(ticket!==current)return;if(c.end>audio.duration+.01){status.textContent='无法播放：片段超出文件范围';return;}audio.currentTime=c.start;stop=c.end;audio.play().then(()=>{if(ticket!==current)return;status.textContent='正在播放：'+c.label;raf=requestAnimationFrame(tick)}).catch(()=>status.textContent='播放失败，请重新点播放');};audio.onerror=()=>{if(ticket===current)status.textContent='音频加载失败，请确认项目文件未移动';};}));
const fields=['self','ref'];const key='f2-task3-leave-check-v001';
function save(){let state={note:document.querySelector('#note').value};for(const n of fields)state[n]=document.querySelector('input[name="'+n+'"]:checked')?.value||'';try{localStorage.setItem(key,JSON.stringify(state))}catch(e){}}
function restore(){try{const s=JSON.parse(localStorage.getItem(key)||'{}');for(const n of fields){for(const el of document.querySelectorAll('input[name="'+n+'"]'))el.checked=el.value===s[n]}document.querySelector('#note').value=s.note||''}catch(e){}}
document.querySelectorAll('input, #note').forEach(el=>el.addEventListener('input',save));restore();
function collect(){const v={};for(const n of fields){v[n]=document.querySelector('input[name="'+n+'"]:checked')?.value||''}if(Object.values(v).some(x=>!x)){document.querySelector('#message').textContent='还有题目没选；拿不准可以选“拿不准”。';return '';}return ['【任务三·离开我的依赖边界复核 v001】','本人边='+v.self,'原唱诺是='+v.ref,'补充='+(document.querySelector('#note').value.trim()||'无')].join('\n')}
function render(){const text=collect();if(!text)return '';document.querySelector('#result').value=text;return text}
document.querySelector('#make').onclick=async()=>{const text=render();if(!text)return;try{await navigator.clipboard.writeText(text);document.querySelector('#message').textContent='已复制，直接粘贴发我。'}catch(e){document.querySelector('#result').focus();document.querySelector('#result').select();document.querySelector('#message').textContent='答案已选中，请复制后发我。'}};
document.querySelector('#download').onclick=()=>{const text=render();if(!text)return;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));a.download='任务三_离开我的依赖_边界复核答案.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);document.querySelector('#message').textContent='已准备下载答案。';};
</script></body></html>
