f80e004533ce143ddb7241c89a29fb2ba945b49dfb2", "frames": 757286, "duration": 17.172018140589568}, {"id": "beautify_gentle", "label": "神经美化 A · 较温和", "file": "delivery/shige_normal__beautify_gentle.wav", "sha256": "8cf9353cfd23e2f520555514040e70aa8314d9b998464388a001061d05b3d9f8", "frames": 757286, "duration": 17.172018140589568}, {"id": "beautify_standard", "label": "神经美化 B · 较明显", "file": "delivery/shige_normal__beautify_standard.wav", "sha256": "b2947f8253f88ab20d02254abf216f5ba3a448161f1c287e5720e04ed6ce7c42", "frames": 757286, "duration": 17.172018140589568}];const player=document.getElementById('player');let busy=false;async function selectVersion(id){if(busy)return;busy=true;const item=variants.find(x=>x.id===id);const time=player.currentTime||0;const resume=!player.paused;player.pause();try{await new Promise((resolve,reject)=>{player.addEventListener('loadedmetadata',resolve,{once:true});player.addEventListener('error',reject,{once:true});player.src=item.file;player.load()});player.currentTime=Math.min(time,Math.max(0,player.duration-.05));document.querySelectorAll('[data-version]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.version===id)));document.getElementById('status').textContent='当前：'+item.label;if(resume)await player.play()}catch(e){document.getElementById('status').textContent='音频加载失败，请刷新重试'}finally{busy=false}}document.querySelectorAll('[data-version]').forEach(b=>b.addEventListener('click',()=>selectVersion(b.dataset.version)));document.querySelectorAll('[data-time]').forEach(b=>b.addEventListener('click',()=>{player.currentTime=Number(b.dataset.time)}));window.selectVersion=selectVersion;</script></html>
