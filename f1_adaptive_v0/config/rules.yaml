version: f1.rules.v0.2
# Research heuristics, not a perceptual quality score.
compressor:
  enabled: true
  min_dynamic_range_db: 18.0
  min_active_seconds: 2.0
  min_loud_event_seconds: 0.08
  min_ratio: 1.3
  max_ratio: 1.8
  max_static_reduction_db: 4.0
  attack_ms: 25.0
  release_ms: 180.0
eq:
  enabled: false
  reason: Spectral energy alone cannot distinguish a defect from the singer's timbre; calibration required.
deesser:
  enabled: false
  reason: Candidate locator only; selective detector/executor not validated in V0.
